{% extends "core/layout2.html" %}

{% block title %}
    ورود
{% endblock %}

{% block main %}
<div class="form-container">
    <div class="form-card">
        <h1 class="form-title">🔐 ورود</h1>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">🚪 ورود</button>
            <a href="{% url 'register' %}" class="btn-cancel">📝 ثبت نام نکرده‌اید؟ عضو شوید</a>
        </form>
    </div>
</div>
{% endblock %}
